[package]
name = "temper-core"
description = "The library behind the fleet CLI: folder discovery, manifest, primitives, converge providers, drift, and a journaled undo."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
jsonc-parser = { version = "0.23", features = ["serde"] }
blake3 = "1"
indicatif = "0.17"
# Already in the tree (indicatif depends on it) — used directly for display-width
# measurement and the terminal size behind `ui::Columns`.
console = "0.15"

[dev-dependencies]
tempfile = "3"
