[package]
name = "temper-core"
description = "The library behind the fleet CLI: folder discovery, manifest, primitives, converge providers, drift, and a journaled undo."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
