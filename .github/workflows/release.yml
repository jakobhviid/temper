name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # One job per OS, building BOTH of that OS's targets — not one job per target.
  # Every hosted-runner request is a chance to be denied ("The job was not acquired
  # by Runner of type hosted even after multiple attempts"), and during GitHub's
  # Actions outage on 2026-08-06 that cost three consecutive releases, each time on
  # a different leg. Two requests instead of four halves the exposure, and the
  # second target costs only build minutes on a runner we already hold — which is
  # why x86_64-apple-darwin stays: Intel Macs are retired, but shipping them a
  # bottle is now free rather than a whole extra runner acquisition.
  #
  # Safe because nothing downstream keys off artifact *names*: the release job
  # downloads with `merge-multiple: true` and addresses everything by filename in
  # `art/`, so one artifact carrying two targets is indistinguishable from two.
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      # A denied runner on one OS must not cancel the other: with fail-fast the
      # healthy leg was killed alongside the unlucky one and re-run for nothing.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            cross: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `temper --version` matches the release)
        run: |
          # Version = Conventional-Commit semver from history (never bump by hand):
          #   feat: -> minor | fix:/other -> patch | type!: breaking -> major (baseline 1.0.0)
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml > "$tmp" && mv "$tmp" Cargo.toml
          echo "stamped $v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build + package each target
        env:
          TARGETS: ${{ matrix.targets }}
          CROSS: ${{ matrix.cross }}
        run: |
          mkdir -p dist
          for t in ${TARGETS//,/ }; do
            echo "::group::build $t"
            if [ "$CROSS" = "true" ]; then
              cross build --release --target "$t"
            else
              cargo build --release --target "$t"
            fi
            tar czf "dist/temper-$t.tar.gz" -C "target/$t/release" temper
            echo "::endgroup::"
          done
      - name: Emit Homebrew bottle tags (macOS)
        if: runner.os == 'macOS'
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          # macos-latest is Apple Silicon, so the host tag is like "arm64_sequoia".
          # Its codename drives both the arm64 and the (cross-built) Intel bottle
          # tag. brew's developer-mode notice goes to stderr; the tag is on stdout.
          host=$(brew ruby -e 'puts Utils::Bottles.tag.to_s' 2>/dev/null)
          codename=${host#arm64_}
          for t in ${TARGETS//,/ }; do
            case "$t" in
              aarch64-apple-darwin) tag="arm64_${codename}" ;;
              x86_64-apple-darwin)  tag="${codename}" ;;
              *) echo "no bottle tag rule for $t" >&2; exit 1 ;;
            esac
            printf '%s' "$tag" > "dist/$t.bottletag"
            echo "bottle tag $t: $tag"
          done
      # One artifact per OS carrying both its targets' files — addressed downstream
      # by filename, so the layout change is invisible to the release job.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same Conventional-Commit semver as the stamp step (kept in sync).
          VERSION=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Repackage the prebuilt binary as Homebrew bottles so `brew install`
          # POURS them (no build-from-source, no C compiler / Xcode gate). A poured
          # bottle skips the formula's `install`, so each keg must already hold what
          # install produces: binary + man page + completions. man/completions are
          # generated CLI text (identical on every platform), so render them once
          # from the Linux binary and reuse them in the macOS kegs too.
          tmp=$(mktemp -d)
          tar xzf art/temper-x86_64-unknown-linux-musl.tar.gz -C "$tmp"
          "$tmp/temper" --man              > "$tmp/temper.1"
          "$tmp/temper" completions zsh  > "$tmp/_temper"
          "$tmp/temper" completions bash > "$tmp/temper.bash"
          "$tmp/temper" completions fish > "$tmp/temper.fish"

          # make_bottle <binary-tarball-in-art> <homebrew-tag> -> prints sha256
          make_bottle() {
            keg="temper/${VERSION}"
            root="stage-$2"
            rm -rf "$root"
            mkdir -p "$root/$keg/bin" \
                     "$root/$keg/share/man/man1" \
                     "$root/$keg/share/zsh/site-functions" \
                     "$root/$keg/share/bash-completion/completions" \
                     "$root/$keg/share/fish/vendor_completions.d"
            tar xzf "art/$1" -C "$root/$keg/bin"
            cp "$tmp/temper.1"    "$root/$keg/share/man/man1/temper.1"
            cp "$tmp/_temper"     "$root/$keg/share/zsh/site-functions/_temper"
            cp "$tmp/temper.bash" "$root/$keg/share/bash-completion/completions/temper"
            cp "$tmp/temper.fish" "$root/$keg/share/fish/vendor_completions.d/temper.fish"
            ( cd "$root" && tar czf "../art/temper-${VERSION}.$2.bottle.tar.gz" temper )
            sha256sum "art/temper-${VERSION}.$2.bottle.tar.gz" | awk '{print $1}'
          }

          ARM_TAG=$(cat art/aarch64-apple-darwin.bottletag)
          X86_TAG=$(cat art/x86_64-apple-darwin.bottletag)
          {
            echo "BOTTLE_SHA=$(make_bottle temper-x86_64-unknown-linux-musl.tar.gz x86_64_linux)"
            echo "MAC_ARM_BOTTLE_SHA=$(make_bottle temper-aarch64-apple-darwin.tar.gz "$ARM_TAG")"
            echo "MAC_X86_BOTTLE_SHA=$(make_bottle temper-x86_64-apple-darwin.tar.gz "$X86_TAG")"
            echo "MAC_CODENAME=${ARM_TAG#arm64_}"
          } >> "$GITHUB_ENV"

          gh release create "v$VERSION" art/*.tar.gz \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set — built & released, but skipping the tap update."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          sha() { sha256sum "art/temper-$1.tar.gz" | awk '{print $1}'; }
          sed -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@MAC_CODENAME@/${MAC_CODENAME}/g" \
            -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" \
            -e "s/@MAC_ARM_BOTTLE_SHA@/${MAC_ARM_BOTTLE_SHA}/g" \
            -e "s/@MAC_X86_BOTTLE_SHA@/${MAC_X86_BOTTLE_SHA}/g" \
            -e "s/@X86_SHA@/$(sha x86_64-unknown-linux-musl)/g" \
            -e "s/@ARM_SHA@/$(sha aarch64-unknown-linux-musl)/g" \
            -e "s/@MAC_X86_SHA@/$(sha x86_64-apple-darwin)/g" \
            -e "s/@MAC_ARM_SHA@/$(sha aarch64-apple-darwin)/g" \
            ci/temper.rb.tmpl > /tmp/temper.rb
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp /tmp/temper.rb tap/Formula/temper.rb
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add Formula/temper.rb
          git commit -m "temper ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
